schema_version = 1
name = "sam2"
project_name = "sam-2"
status = "maintained"
upstream = "https://github.com/facebookresearch/sam2"
gpu_risk = "high"

[license]
expression = "Apache-2.0"
files = ["LICENSE"]
confidence = "high"
notes = "Code license does not cover model checkpoint assets."

[build]
backend = "pip-wheel-git"
script = "build.sh"
common_pip_flags = true

[build.source]
url = "https://files.pythonhosted.org/packages/ce/11/d07fc96688f731a85de6d5260e98b709051eded2b7b5667ae292530bcf90/sam2-1.1.0.tar.gz"
revision = "1.1.0"

[build.env]
exports = ["SAM2_BUILD_CUDA", "SAM2_BUILD_ALLOW_ERRORS"]
defaults = { SAM2_BUILD_CUDA = "1", SAM2_BUILD_ALLOW_ERRORS = "0" }
